plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        client {
            if (project.hasProperty('clientSmoke')) vmArg '-Dwildslabs.clientSmoke=true'
        }
        gameTestServer {
            server()
            name 'WildSlabs Game Tests'
            vmArg '-Dneoforge.enableGameTest=true'
            vmArg '-Dneoforge.gameTestServer=true'
            vmArg '-Dneoforge.enabledGameTestNamespaces=wildslabs'
            vmArg '-Xmx4G'
            runDir 'run-gametest'
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation include("dev.architectury:architectury-neoforge:$rootProject.architectury_api_version")

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    modImplementation include ("eu.midnightdust:midnightlib:${project.midnightlib_version_neoforge}")

    modCompileOnly("maven.modrinth:embeddium:1.0.13+mc1.21.1")
    modCompileOnly("maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge")
}

processResources {
    from(rootProject.file('LICENSES')) {
        into 'LICENSES'
    }
    from(rootProject.file('LICENSE'))
    from(rootProject.file('CREDITS.md'))
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }

    from(project(':common').sourceSets.main.resources)
}

sourceSets {
    main {
        resources {
            srcDir "../common/src/generated"
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
